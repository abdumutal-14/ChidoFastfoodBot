<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Chido Fastfood</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="hero">
    <img src="/img/chido-logo.jpeg" class="logo" alt="Chido">
    <div>
      <h1>Chido Fastfood</h1>
      <p>🚚 Yetkazib berish bepul</p>
    </div>
  </header>

  <main>
    <section class="category-strip" id="categories"></section>
    <section id="products" class="products"></section>
  </main>

  <button class="cart-fab" id="cartBtn">🛒 Savatcha <span id="cartCount">0</span></button>

  <div class="sheet hidden" id="cartSheet">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2>Savatcha</h2>
        <button class="ghost" id="closeCart">✕</button>
      </div>
      <div id="cartItems"></div>
      <div class="total-row"><span>Jami</span><b id="cartTotal">0 so‘m</b></div>
      <div class="delivery-note">🚚 Yetkazib berish: BEPUL</div>
      <button class="primary" id="checkoutBtn">Buyurtma berish</button>
    </div>
  </div>

  <div class="sheet hidden" id="checkoutSheet">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2>Buyurtma</h2>
        <button class="ghost" id="closeCheckout">✕</button>
      </div>

      <label>Filial</label>
      <select id="branch"></select>

      <label>Buyurtma turi</label>
      <select id="orderType">
        <option value="delivery">🚚 Yetkazib berish — bepul</option>
        <option value="pickup">🏪 Olib ketish</option>
      </select>

      <label>Telefon raqam</label>
      <input id="phone" placeholder="+998 90 123 45 67" inputmode="tel">

      <label id="addressLabel">Manzil</label>
      <input id="address" placeholder="Masalan: 5-mavze, 12-uy">

      <label>To‘lov</label>
      <select id="payment">
        <option value="Naqd">💵 Naqd</option>
        <option value="Karta">💳 Karta</option>
      </select>

      <label>Izoh (ixtiyoriy)</label>
      <textarea id="comment" placeholder="Masalan: achchiq soussiz"></textarea>

      <button class="primary" id="submitOrder">✅ Buyurtmani tasdiqlash</button>
      <p class="error" id="checkoutError"></p>
    </div>
  </div>

  <div class="sheet hidden" id="successSheet">
    <div class="sheet-card center">
      <div class="success-icon">✅</div>
      <h2>Buyurtma qabul qilindi!</h2>
      <p id="successText"></p>
      <button class="primary" id="successClose">Bosh menyuga qaytish</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
