services:
  - type: web
    name: chido-fastfood-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: ChidoFastfoodbot
      - key: SETUP_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
